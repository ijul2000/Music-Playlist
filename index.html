<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — Neon Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="stage">
    <div class="phone" id="phone">

      <!-- Phone notch / speaker -->
      <div class="phone__notch"></div>

      <div class="screen">

        <!-- Status bar -->
        <header class="statusbar">
          <span class="statusbar__time" id="clock">10:09</span>
          <div class="statusbar__icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C8.6 10.5 9.1 10.28 9.47 9.9C9.9 9.48 9.9 8.8 9.47 8.4C8.65 7.62 7.35 7.62 6.53 8.4C6.1 8.8 6.1 9.48 6.53 9.9C6.9 10.28 7.4 10.5 8 10.5Z" fill="currentColor"/><path d="M4.7 6.9C6.53 5.24 9.47 5.24 11.3 6.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M1.8 3.9C5.7 0.4 10.3 0.4 14.2 3.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
          </div>
        </header>

        <!-- Nav row -->
        <div class="nowplaying-nav">
          <button class="icon-btn" aria-label="Tutup">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="nowplaying-nav__label">SEDANG DIMAINKAN</span>
          <button class="icon-btn" aria-label="Lagi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
          </button>
        </div>

        <!-- Album art -->
        <div class="artwork">
          <div class="artwork__glow"></div>
          <div class="artwork__frame">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="artwork__scene" role="img" aria-label="Ilustrasi jalan neon waktu malam">
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1b0a3a"/>
                  <stop offset="45%" stop-color="#5a1667"/>
                  <stop offset="75%" stop-color="#e8467a"/>
                  <stop offset="100%" stop-color="#ffb36b"/>
                </linearGradient>
                <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffe27a"/>
                  <stop offset="100%" stop-color="#ff5d8f"/>
                </linearGradient>
                <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#2c1150"/>
                  <stop offset="100%" stop-color="#120523"/>
                </linearGradient>
                <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.4"/>
                </linearGradient>
              </defs>

              <rect width="400" height="400" fill="url(#sky)"/>

              <!-- stars -->
              <g fill="#ffffff" opacity="0.8">
                <circle cx="40" cy="40" r="1.4"/><circle cx="90" cy="70" r="1"/><circle cx="150" cy="35" r="1.6"/>
                <circle cx="220" cy="60" r="1"/><circle cx="280" cy="30" r="1.3"/><circle cx="340" cy="55" r="1"/>
                <circle cx="365" cy="90" r="1.4"/><circle cx="30" cy="100" r="1"/><circle cx="190" cy="20" r="1"/>
              </g>

              <!-- sun -->
              <circle cx="200" cy="175" r="70" fill="url(#sun)"/>
              <g stroke="#1b0a3a" stroke-width="4">
                <line x1="130" y1="185" x2="270" y2="185"/>
                <line x1="135" y1="200" x2="265" y2="200"/>
                <line x1="140" y1="215" x2="260" y2="215"/>
                <line x1="147" y1="230" x2="253" y2="230"/>
              </g>

              <!-- mountains -->
              <polygon points="0,230 70,150 140,230" fill="#3a1352" opacity="0.85"/>
              <polygon points="260,230 330,140 400,230" fill="#3a1352" opacity="0.85"/>

              <!-- ground -->
              <rect x="0" y="230" width="400" height="170" fill="url(#road)"/>

              <!-- perspective grid -->
              <g stroke="url(#grid)" stroke-width="1.5" opacity="0.75">
                <line x1="200" y1="230" x2="0" y2="400"/>
                <line x1="200" y1="230" x2="60" y2="400"/>
                <line x1="200" y1="230" x2="150" y2="400"/>
                <line x1="200" y1="230" x2="250" y2="400"/>
                <line x1="200" y1="230" x2="340" y2="400"/>
                <line x1="200" y1="230" x2="400" y2="400"/>
                <line x1="30" y1="270" x2="370" y2="270"/>
                <line x1="10" y1="320" x2="390" y2="320"/>
                <line x1="-20" y1="380" x2="420" y2="380"/>
              </g>

              <!-- road -->
              <polygon points="170,290 230,290 320,400 80,400" fill="#0d0316"/>
              <g fill="#ffe27a">
                <polygon points="196,300 200,300 197,320 192,320"/>
                <polygon points="188,335 193,335 189,362 183,362"/>
                <polygon points="177,378 183,378 178,400 170,400"/>
                <polygon points="204,300 200,300 203,320 208,320"/>
                <polygon points="212,335 207,335 211,362 217,362"/>
                <polygon points="223,378 217,378 222,400 230,400"/>
              </g>

              <!-- car silhouette -->
              <g transform="translate(160,318)">
                <ellipse cx="40" cy="60" rx="52" ry="8" fill="#000" opacity="0.35"/>
                <path d="M2 50 L10 30 Q16 18 34 16 L58 16 Q74 18 78 32 L80 50 Q80 58 70 58 L12 58 Q2 58 2 50 Z" fill="#100420" stroke="#ff2e88" stroke-width="1.5"/>
                <path d="M20 30 Q26 20 38 19 L54 19 Q64 20 68 30 Z" fill="#1c0836"/>
                <circle cx="16" cy="58" r="8" fill="#0a0212" stroke="#00e5ff" stroke-width="1.5"/>
                <circle cx="66" cy="58" r="8" fill="#0a0212" stroke="#00e5ff" stroke-width="1.5"/>
                <rect x="4" y="44" width="8" height="4" rx="2" fill="#ff2e88"/>
                <rect x="70" y="44" width="8" height="4" rx="2" fill="#ff2e88"/>
              </g>

              <!-- streetlight -->
              <g transform="translate(300,150)">
                <rect x="-2" y="0" width="4" height="130" fill="#1c0836"/>
                <path d="M-2 4 L-40 -6" stroke="#1c0836" stroke-width="4"/>
                <circle cx="-42" cy="-8" r="9" fill="#c8f6ff"/>
                <circle cx="-42" cy="-8" r="20" fill="#7ff0ff" opacity="0.25"/>
              </g>
            </svg>
          </div>
        </div>

        <!-- Track info -->
        <section class="track">
          <h1 class="track__title">SUNSET BOULEVARD</h1>
          <div class="track__row">
            <button class="like-btn" id="likeBtn" aria-pressed="true" aria-label="Suka lagu ini">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.2-4.5-10-9.3C.4 8 1.8 4 5.6 3.1 8 2.5 10.3 3.6 12 6c1.7-2.4 4-3.5 6.4-2.9C22.2 4 23.6 8 22 11.7 19.2 16.5 12 21 12 21z"/></svg>
            </button>
            <p class="track__artist">Neon Drive</p>
            <button class="icon-btn icon-btn--sm" aria-label="Lagi pilihan">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
            </button>
          </div>
        </section>

        <!-- Progress -->
        <section class="progress" id="progressSection">
          <div class="progress__track" id="progressTrack">
            <div class="progress__fill" id="progressFill"></div>
            <div class="progress__thumb" id="progressThumb"></div>
          </div>
          <div class="progress__times">
            <span id="timeCurrent">1:28</span>
            <span id="timeTotal">3:54</span>
          </div>
        </section>

        <!-- Transport controls -->
        <section class="controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Lagu sebelum">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg>
          </button>

          <button class="play-btn" id="playBtn" aria-label="Main / Jeda" aria-pressed="true">
            <span class="play-btn__ring"></span>
            <svg id="iconPause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
            <svg id="iconPlay" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <button class="ctrl-btn" id="nextBtn" aria-label="Lagu seterusnya">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>
          </button>
        </section>

        <!-- Secondary controls -->
        <section class="controls-secondary">
          <button class="mini-btn" id="shuffleBtn" aria-pressed="true" aria-label="Rawak">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          </button>
          <button class="mini-btn" id="repeatBtn" aria-pressed="true" aria-label="Ulang">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span class="mini-btn__dot"></span>
          </button>
          <button class="mini-btn" id="shareBtn" aria-label="Kongsi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2h-3"/><path d="M8 12H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2"/></svg>
          </button>
        </section>

        <!-- Bottom tab bar -->
        <nav class="tabbar">
          <button class="tab-btn" data-tab="home" aria-label="Utama">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          </button>
          <button class="tab-btn" data-tab="search" aria-label="Cari">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="tab-btn tab-btn--active" data-tab="library" aria-label="Koleksi">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="4" y2="18"/><line x1="10" y1="4" x2="10" y2="20"/><line x1="16" y1="7" x2="16" y2="17"/><line x1="21" y1="9" x2="21" y2="15"/></svg>
          </button>
          <button class="tab-btn" data-tab="menu" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
        </nav>
        <div class="home-indicator"></div>

      </div>
    </div>

    <p class="stage__hint">Seret bar untuk ubah masa lagu &middot; Klik butang main/jeda</p>
  </main>

<script src="script.js"></script>
</body>
</html>
