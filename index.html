<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <h1 class="brand-name">Prime<span>Music</span></h1>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-page="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>

        <button class="nav-btn" data-page="library">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="4" height="18" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="7" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="16" y="10" width="4" height="11" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Library</span>
        </button>

        <button class="nav-btn" data-page="admin">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H4.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.04 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10.5a1.7 1.7 0 0 0 1.04-1.56V4.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10.5a1.7 1.7 0 0 0 1.56 1.04H19.5a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Admin</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="dot"></span>
        <span>v0.1</span>
      </div>
    </aside>

    <main class="content">
      <div class="empty-state">
        <svg class="page-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#9b5cff"/>
              <stop offset="100%" stop-color="#4bffa5"/>
            </linearGradient>
          </defs>

          <circle class="vinyl-disc" cx="60" cy="60" r="46" stroke="url(#logoGrad)" stroke-width="1.4" opacity="0.55"/>
          <circle class="vinyl-disc" cx="60" cy="60" r="34" stroke="url(#logoGrad)" stroke-width="1.4" opacity="0.35"/>

          <g class="vinyl-spin">
            <circle cx="60" cy="60" r="20" fill="#0a0b10" stroke="url(#logoGrad)" stroke-width="1.6"/>
            <path d="M60 40a20 20 0 0 1 20 20" stroke="url(#logoGrad)" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="60" cy="60" r="13" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.5"/>
            <circle cx="60" cy="60" r="4.5" fill="url(#logoGrad)"/>
          </g>
        </svg>
        <p class="empty-label" id="page-label">Home</p>
      </div>
    </main>

  </div>

<script src="script.js"></script>
</body>
</html>
